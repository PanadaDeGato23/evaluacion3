<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Razas de gatos</title>
  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/script.js" defer></script>
</head>
<body>
  <header class="encabezado py-4">
    <div class="container">
      <h1 class="h2 mb-1">Catálogo de razas de gatos</h1>
      <p class="mb-0">Datos generales sobre gatos.</p>
    </div>
  </header>

  <main class="container my-4">
    <!-- Filtros -->
    <section class="row g-3 align-items-end mb-3" aria-label="Filtros de razas">
      <div class="col-12 col-md-5">
        <label for="buscarNombre" class="form-label">Buscar por nombre</label>
        <input type="search" id="buscarNombre" class="form-control" placeholder="Ej.: Birman">
      </div>
      <div class="col-12 col-md-5">
        <label for="filtroPelaje" class="form-label">Filtrar por pelaje</label>
        <select id="filtroPelaje" class="form-select">
          <option value="">Todos los pelajes</option>
        </select>
      </div>
      <div class="col-12 col-md-2">
        <button type="button" id="limpiarFiltros" class="btn btn-outline-secondary w-100">Limpiar filtros</button>
      </div>
    </section>

    <p id="mensaje" role="status">Cargando razas...</p>

    <!-- Tarjetas de razas -->
    <div id="listaRazas" class="row g-4"></div>
  </main>

  <footer class="container py-3 border-top">
    <p class="mb-0 text-muted">--- Catalogo de gatos ---</p>
  </footer>
</body>
</html>
